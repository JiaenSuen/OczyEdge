<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}System MVP{% endblock %}</title>
    <style>
        :root {
            --bg: #f6f9ff;
            --surface: #ffffff;
            --surface-soft: #f8fbff;
            --border: #d9e4f2;
            --text: #1f2937;
            --muted: #667085;
            --primary: #87b7ff;
            --primary-hover: #4f8ef7;
            --primary-soft: #eaf2ff;
            --danger: #b42318;
            --danger-bg: #fef3f2;
            --radius: 16px;
            --shadow: 0 10px 30px rgba(15, 23, 42, 0.06);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: var(--bg);
            color: var(--text);
        }

        a {
            color: var(--primary-hover);
            text-decoration: none;
        }

        a:hover { text-decoration: underline; }

        .container {
            max-width: 1120px;
            margin: 0 auto;
            padding: 32px 20px 48px;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            margin-bottom: 24px;
        }

        .brand h1 {
            margin: 0 0 4px;
            font-size: 24px;
            line-height: 1.2;
            letter-spacing: -0.02em;
        }

        .brand p {
            margin: 0;
            color: var(--muted);
            font-size: 14px;
        }

        .nav {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .nav a {
            display: inline-flex;
            align-items: center;
            padding: 10px 14px;
            border: 1px solid var(--border);
            border-radius: 999px;
            background: var(--surface);
            color: var(--text);
            font-size: 14px;
            transition: 0.2s ease;
            text-decoration: none;
        }

        .nav a:hover {
            background: var(--primary-soft);
            border-color: #c8daf8;
            text-decoration: none;
        }

        .grid {
            display: grid;
            gap: 20px;
            align-items: stretch;
        }

        .grid.two-col {
            grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        @media (max-width: 900px) {
            .topbar {
                flex-direction: column;
                align-items: flex-start;
            }

            .grid.two-col {
                grid-template-columns: 1fr;
            }
        }

        .panel {
            height: 100%;
            display: flex;
            flex-direction: column;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 24px;
        }

        .section-title {
            margin: 0 0 6px;
            font-size: 18px;
            font-weight: 700;
            letter-spacing: -0.01em;
        }

        .section-desc {
            margin: 0 0 18px;
            color: var(--muted);
            font-size: 14px;
            line-height: 1.6;
        }

        .field { margin-bottom: 16px; }

        .field label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            font-weight: 600;
        }

        .input {
            width: 100%;
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 12px 14px;
            font-size: 14px;
            background: #fff;
            color: var(--text);
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .input:focus {
            border-color: #aac8ff;
            box-shadow: 0 0 0 4px rgba(110, 168, 255, 0.16);
        }

        .actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 10px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 11px 16px;
            border: 1px solid transparent;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s ease;
            text-decoration: none;
            white-space: nowrap;
        }

        .btn-primary {
            background: var(--primary);
            color: #fff;
        }

        .btn-primary:hover { background: var(--primary-hover); }

        .btn-secondary {
            background: #ffffff;
            color: var(--text);
            border-color: var(--border);
        }

        .btn-secondary:hover {
            border-color: #c8d6ea;
            background: #fbfdff;
            text-decoration: none;
        }

        .btn-danger {
            background: var(--danger-bg);
            color: var(--danger);
            border-color: #fecaca;
        }

        .btn-danger:hover {
            background: #fee4e2;
            text-decoration: none;
        }

        .table {
            width: 100%;
            border-collapse: collapse;
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
        }

        .table th,
        .table td {
            padding: 14px 16px;
            text-align: left;
            border-bottom: 1px solid var(--border);
            font-size: 14px;
            vertical-align: middle;
        }

        .table th {
            background: #f8fbff;
            color: #334155;
            font-weight: 700;
        }

        .table tr:last-child td { border-bottom: none; }

        .empty-state {
            padding: 18px;
            border: 1px dashed #cfd8e3;
            border-radius: 12px;
            color: var(--muted);
            background: #fafcff;
            font-size: 14px;
        }

        .file-row {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .file-name {
            color: var(--muted);
            font-size: 14px;
        }

        .preview-wrap {
            margin-top: 14px;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 14px;
            background: var(--surface-soft);
        }

        .preview-wrap img {
            display: block;
            width: 100%;
            max-height: 240px;
            object-fit: contain;
            border-radius: 10px;
            background: #fff;
        }

        .result-box {
            border: 1px solid var(--border);
            border-radius: 14px;
            background: #fbfdff;
            padding: 18px;
        }

        .result-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 14px;
        }

        @media (max-width: 720px) {
            .result-grid {
                grid-template-columns: 1fr;
            }
        }

        .metric {
            padding: 14px;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: #fff;
        }

        .metric .label {
            font-size: 13px;
            color: var(--muted);
            margin-bottom: 6px;
        }

        .metric .value {
            font-size: 16px;
            font-weight: 700;
            word-break: break-word;
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="topbar">
            <div class="brand">
                <h1>Vision Checkout System</h1>
                <p>Product management and image-based checkout workflow.</p>
            </div>
            <nav class="nav">
                <a href="{{ url_for('index') }}">Home</a>
                <a href="{{ url_for('register') }}">Product Management</a>
                <a href="{{ url_for('checkout') }}">Checkout</a>
            </nav>
        </header>

        {% block content %}{% endblock %}
    </div>

    <script>
        function setupFilePreview(inputId, fileNameId, previewId) {
            const input = document.getElementById(inputId);
            const fileName = document.getElementById(fileNameId);
            const preview = document.getElementById(previewId);
            const previewImg = preview ? preview.querySelector("img") : null;

            if (!input || !fileName || !preview || !previewImg) return;

            input.addEventListener("change", () => {
                const file = input.files && input.files[0];

                if (!file) {
                    fileName.textContent = "No file selected";
                    preview.hidden = true;
                    previewImg.removeAttribute("src");
                    return;
                }

                fileName.textContent = file.name;
                preview.hidden = false;

                const objectUrl = URL.createObjectURL(file);
                previewImg.src = objectUrl;
                previewImg.onload = () => URL.revokeObjectURL(objectUrl);
            });
        }

        document.addEventListener("DOMContentLoaded", () => {
            setupFilePreview("register-image", "register-file-name", "register-preview");
            setupFilePreview("checkout-image", "checkout-file-name", "checkout-preview");
        });
    </script>
</body>
</html>
